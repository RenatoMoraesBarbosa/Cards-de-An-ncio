<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<link rel="stylesheet" href="cartao.css">
<body>

    <h1>Produtos</h1>

    <div class="produtos">

        <div class="card">
            <img src="pexels-xt7core-18172216.jpg">
            <h2>Teclado Gamer</h2>
            <p>Teclado mecânico para jogos e uso diário.</p>
            <span>R$ 250,00</span>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="pexels-jibin-yesudasan-2153859944-34704932.jpg" alt="Mouse">
            <h2>Mouse Gamer</h2>
            <p>Mouse com alta precisão e conforto.</p>
            <span>R$ 150,00</span>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="pexels-bertellifotografia-18966439.jpg" alt="Headset">
            <h2>Headset</h2>
            <p>Headset com microfone para jogos e reuniões.</p>
            <span>R$ 200,00</span>
            <button>Comprar</button>
        </div>

    </div>

</body>
</html>
